<div class="admin-container">
  <header class="admin-header">
    <div class="title-section">
      <h1>問卷管理系統 <span class="badge">後台</span></h1>
    </div>
    <button mat-flat-button color="warn" routerLink="//login" class="logout-btn">
      <mat-icon>logout</mat-icon> 登出管理員
    </button>
  </header>

  <main class="content-wrapper">
    <section class="filter-card">
      <div class="search-row">
        <mat-form-field appearance="outline" class="search-input">
          <mat-label>搜尋問卷名稱</mat-label>
          <input matInput [(ngModel)]="inputD" placeholder="請輸入關鍵字...">
        </mat-form-field>

        <div class="date-range">
          <mat-form-field appearance="outline">
            <mat-label>起始時間</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="quiz.startDate" [max]="quiz.endDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <span class="date-separator">至</span>

          <mat-form-field appearance="outline">
            <mat-label>結束時間</mat-label>
            <input matInput [matDatepicker]="picker1" [(ngModel)]="quiz.endDate" [min]="quiz.startDate">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>
        </div>

        <button mat-fab color="primary" (click)="getxt()" class="search-btn">
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </section>

    <div class="action-bar">
      <button mat-raised-button color="warn" (click)="deleteQuestion()">
        <mat-icon>delete</mat-icon> 批量刪除
      </button>
      <button mat-raised-button class="add-btn" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon> 建立新問卷
      </button>
    </div>

    <div class="table-container mat-elevation-z3">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef> 選取 </th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [(ngModel)]="element.select" color="primary"></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> # </th>
          <td mat-cell *matCellDef="let element" class="id-col"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> 問卷標題 </th>
          <td mat-cell *matCellDef="let element">
            <a (click)="isUpdateOrReadOnly(element)" class="title-link"> {{element.title}} </a>
          </td>
        </ng-container>

        <ng-container matColumnDef="published">
          <th mat-header-cell *matHeaderCellDef> 狀態 </th>
          <td mat-cell *matCellDef="let element">
            <span class="status-badge" [ngClass]="{
                'gray': !element.published,
                'green': element.published && publishState(element) === '進行中',
                'blue': publishState(element) === '未開始',
                'red': publishState(element) === '已結束'
              }">
              {{ publishState(element) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef> 開始日期 </th>
          <td mat-cell *matCellDef="let element"> {{element.startDate | date:'yyyy-MM-dd'}} </td>
        </ng-container>

        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef> 結束日期 </th>
          <td mat-cell *matCellDef="let element"> {{element.endDate | date:'yyyy-MM-dd'}} </td>
        </ng-container>

        <ng-container matColumnDef="result">
          <th mat-header-cell *matHeaderCellDef> 數據分析 </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="accent" (click)="viewResult(element)">
              <mat-icon>bar_chart</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </main>
</div>
