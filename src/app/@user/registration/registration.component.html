<div class="page-container">
  <div class="card">
    <div class="header">
      <button class="btn-back" (click)="backLogin()">返回登入</button>
      <h2>問卷調查系統</h2>
      <h3>會員註冊</h3>
    </div>

    <div>
      <div class="input-group">
        <p>姓名</p>
        <input type="text" [(ngModel)]="user.name" placeholder="請輸入姓名">
      </div>

      <div class="input-group">
        <p>電子郵件</p>
        <input type="text" [(ngModel)]="user.email" placeholder="請輸入電子郵件">
      </div>

      <div class="input-group">
        <p>密碼</p>
        <input type="password" [(ngModel)]="user.password" placeholder="請輸入密碼">
      </div>

      <div class="input-group">
        <p>手機號碼</p>
        <input type="text" [(ngModel)]="user.phone" placeholder="請輸入手機號碼">
      </div>

      <div class="input-group">
        <p>年齡</p>
        <input type="number" [(ngModel)]="user.age" placeholder="請輸入年齡">
      </div>
    </div>

    <div class="action-group">
      <button class="btn-reg" (click)="registration()">立即註冊</button>
    </div>
  </div>
</div>
