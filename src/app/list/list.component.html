<div class="page-container">
  <div class="content-wrapper">

    <div class="search-card">
      <div class="top-actions">
        <button class="btn-logout" (click)="logout()">登出</button>
      </div>

      <div class="search-form">
        <div class="input-row">
          <span class="label">問卷名稱:</span>
          <input type="text" [(ngModel)]="inputD" placeholder="請輸入關鍵字">
        </div>

        <div class="date-row">
          <mat-form-field appearance="outline" class="date-picker">
            <mat-label>起始時間</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="startData" [max]="endData">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <span class="date-sep">到</span>

          <mat-form-field appearance="outline" class="date-picker">
            <mat-label>結束時間</mat-label>
            <input matInput [matDatepicker]="picker1" [(ngModel)]="endData" [min]="startData">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
          </mat-form-field>

          <button class="btn-search" (click)="getxt()">
            <mat-icon fontIcon="search"></mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="table-container mat-elevation-z4">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> 編號 </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> 名稱 </th>
          <td mat-cell *matCellDef="let element" class="title-cell"> {{element.title}} </td>
        </ng-container>

        <ng-container matColumnDef="published">
          <th mat-header-cell *matHeaderCellDef> 狀態 </th>
          <td mat-cell *matCellDef="let element">
            <span class="status-badge" [ngClass]="{ 'active': publishState(element) === '進行中' }">
              {{this.publishState(element)}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="startDate">
          <th mat-header-cell *matHeaderCellDef> 開始時間 </th>
          <td mat-cell *matCellDef="let element"> {{element.startDate}} </td>
        </ng-container>

        <ng-container matColumnDef="endDate">
          <th mat-header-cell *matHeaderCellDef> 結束時間 </th>
          <td mat-cell *matCellDef="let element"> {{element.endDate}} </td>
        </ng-container>

        <ng-container matColumnDef="isfill">
          <th mat-header-cell *matHeaderCellDef> 操作 </th>
          <td mat-cell *matCellDef="let element">
            <button class="link-btn" (click)="fillIn(element)">填寫</button>
          </td>
        </ng-container>

        <ng-container matColumnDef="result">
          <th mat-header-cell *matHeaderCellDef> 結果 </th>
          <td mat-cell *matCellDef="let element">
            <button class="link-btn secondary" (click)="openPersonalFeedback(element)">查看結果</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
