<div class="page-container">
  <div class="content-wrapper">
    <div class="header-card">
      <div class="header-left">
        <p class="subtitle">問卷結果 - 填寫紀錄</p>
        <h2 class="main-title">{{this.quizTitle}}</h2>
      </div>

      <div class="header-right">
        <button mat-stroked-button class="btn-secondary" routerLink="/blist">
          <mat-icon>arrow_back</mat-icon> 回首頁
        </button>
        <button mat-flat-button color="primary" class="btn-chart" (click)="viewChart()">
          <mat-icon>bar_chart</mat-icon> 圖表分析
        </button>
      </div>
    </div>

    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> 姓名 </th>
          <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> 電子信箱 </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <ng-container matColumnDef="fillinDate">
          <th mat-header-cell *matHeaderCellDef> 填寫日期 </th>
          <td mat-cell *matCellDef="let element"> {{element.fillinDate | date:'yyyy-MM-dd'}} </td>
        </ng-container>

        <ng-container matColumnDef="result">
          <th mat-header-cell *matHeaderCellDef> 操作 </th>
          <td mat-cell *matCellDef="let element">
            <button mat-button color="link" (click)="viewResult(element)" class="view-btn">
              查看回覆
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
